name: Maven Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Required by maven-dependency-submission-action
permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven
        run: mvn --version

      - name: Build with Maven
        run: mvn -B clean verify

      - name: Submit Maven dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v6.0.1
        with:
          directory: .
          token: ${{ github.token }}
